services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3001:3001"
    environment:
      CADDY_STAGING_IP: ${CADDY_STAGING_IP:-217.30.74.35}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - clearfork-app

  clearfork-app:
    image: clearfork-insurance:latest
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    env_file:
      - .env.production
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mysql

  # Optional: not started on `docker compose up -d` (profile: staging). Same image, port 8081, separate DB and uploads.
  # Start/stop: ./staging on | ./staging off
  clearfork-app-staging:
    profiles: [staging]
    image: clearfork-insurance:latest
    # Only reachable on the compose network (Caddy :3001). No host port — avoids 127.0.0.1 vs 172.17.0.1 (host.docker.internal) mismatch.
    expose:
      - "8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
    env_file:
      - .env.staging
    restart: "no"
    volumes:
      - ./uploads-staging:/app/uploads
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=ClearForkRoot2024!
      - MYSQL_DATABASE=clearfork-insurance
      - MYSQL_USER=clearfork_user
      - MYSQL_PASSWORD=ClearFork2024SecureDB!
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
