version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - clearfork-app

  clearfork-app:
    image: clearfork-insurance:latest
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    env_file:
      - .env.production
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=ClearForkRoot2024!
      - MYSQL_DATABASE=clearfork-insurance
      - MYSQL_USER=clearfork_user
      - MYSQL_PASSWORD=ClearFork2024SecureDB!
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
