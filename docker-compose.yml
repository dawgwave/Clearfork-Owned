version: '3.8'

services:
  clearfork-app:
    image: clearfork-insurance:latest
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.production
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=ClearForkRoot2024!
      - MYSQL_DATABASE=clearfork-insurance
      - MYSQL_USER=clearfork_user
      - MYSQL_PASSWORD=ClearFork2024SecureDB!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  mysql_data: